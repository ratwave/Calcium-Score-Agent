name: Weekly CAC Research Update

on:
  schedule:
    # Monday 14:00 UTC weekly
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate weekly report
        run: python3 scripts/weekly_cac_agent.py --update-latest

      - name: Email weekly report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Weekly CAC > 600 Report - ${{ github.run_number }}"
          to: mr@rationalwave.com
          from: ${{ secrets.EMAIL_FROM }}
          html_body: |
            <h2>Weekly CAC &gt; 600 Research Update</h2>
            <p>The latest report is attached and also committed in the repository.</p>
            <p>Generated by workflow run #${{ github.run_number }}.</p>
          attachments: reports/latest.md

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/weekly reports/latest.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: weekly CAC research update"
          git push
